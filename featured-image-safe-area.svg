<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" opacity="0.5">
<title>Featured image crop and safe-area guide</title>
<desc>1600 by 1200 master. Centered square crop x200 to1400, phone crop y150 to1050, wide mobile crop y200 to1000. Recommended important content inside x360 to1240 and y260 to940.</desc>
<defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#334155" stroke-width="1"/></pattern></defs>
<rect width="1600" height="1200" fill="#101827"/>
<rect width="1600" height="1200" fill="url(#grid)"/>
<g font-family="DejaVu Sans, sans-serif" text-anchor="middle" fill="#f8fafc">
<text x="800" y="58" font-size="32" font-weight="bold">FEATURED IMAGE • 1600 × 1200 • 4:3 MASTER</text>
<text x="800" y="100" font-size="22">Desktop shows the full canvas. Other layouts crop from the center.</text>
<rect x="200" y="3" width="1200" height="1194" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="18 10"/>
<rect x="3" y="150" width="1594" height="900" fill="none" stroke="#c084fc" stroke-width="5" stroke-dasharray="18 10"/>
<rect x="3" y="200" width="1594" height="800" fill="none" stroke="#38bdf8" stroke-width="5"/>
<rect x="360" y="260" width="880" height="680" rx="12" fill="#14532d" fill-opacity="0.88" stroke="#86efac" stroke-width="5"/>
<path d="M780 600H820M800 580V620" stroke="#86efac" stroke-width="2"/>
<text x="800" y="410" font-size="40" font-weight="bold" fill="#bbf7d0">IMPORTANT UI / TEXT</text>
<text x="800" y="463" font-size="27">Keep essential elements inside this box</text>
<text x="800" y="510" font-size="25">880 × 680 px • centered</text>
<text x="800" y="705" font-size="25">Left 360 • Top 260 • Right 1240 • Bottom 940</text>
<text x="800" y="753" font-size="23">22.5–77.5% width • 21.7–78.3% height</text>
<text x="800" y="832" font-size="22">Includes space for arrows, dots and edge breathing room</text>
<text x="800" y="878" font-size="22">Large UI details work best in the small square tablet view</text>
<text x="800" y="1132" font-size="24" fill="#fbbf24">DASHED GOLD: tablet square • x 200–1400 • 761–1024 px viewport</text>
<text x="800" y="1174" font-size="21">Guide layer only: hide before exporting your actual featured image</text>
</g>
<g font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold">
<rect x="410" y="125" width="780" height="48" rx="6" fill="#101827"/>
<text x="800" y="157" text-anchor="middle" fill="#c084fc">DASHED PURPLE: phone 16:9 • y 150–1050 • below 560 px</text>
<rect x="380" y="976" width="840" height="48" rx="6" fill="#101827"/>
<text x="800" y="1008" text-anchor="middle" fill="#38bdf8">BLUE: wide mobile 2:1 • y 200–1000 • 560–760 px</text>
</g>
</svg>