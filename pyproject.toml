[project]
name = "portfolio"
version = "0.1.0"
description = "Portfolio site and markdown publishing pipeline for Kevin Hu"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "pygments>=2.21.0",
    "pygments-styles>=0.3.0",
    "pymarkdownlnt>=0.9.40",
    "pymdown-extensions>=12.0.1",
    "python-frontmatter>=1.3.0",
    "rcssmin>=1.2.2",
    "rjsmin>=1.2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "livereload>=2.7.1",
    "watchfiles>=1.2.0",
]
