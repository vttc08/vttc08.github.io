- slug: "htpc-troubleshooter"
  title: "HTPC Troubleshooter"
  description: >-
    Instead of spending 5 minutes with technical support, I developed a multilingual full-stack FastAPI webapp while learning new framework and technologies. It integrates with Jellyfin, Home Assistant, ffmpeg and onkyo-eiscp to diagnose and propose solutions for media playback issues that my parents encounter. HTMX and SSE provide a user-friendly interface with live troubleshooting updates, while a bundled Hugo site provides documentation. This months-long learning experience strengthened my web development skills and solved a practical problem for my family. 
