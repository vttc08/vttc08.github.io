- slug: "oracle-vps"
  title: "Oracle Cloud VPS Tunneling"
  description: >-
    On campus, the restricted network prevented me from forwarding ports. To allow my parents to stream Jellyfin or my friend to play Minecraft, I used [Oracle Cloud free tier](https://www.oracle.com/cloud/free/) and [Tailscale](https://tailscale.com/) to create a mesh network, with an Nginx reverse proxy to route different services. My clients were able to access these services without any issues. Exploring tunneling solutions allowed me to adapt to the limitations of any networks while still providing services at no cost.
  category: "Homelab"
  type: "Cloud Infrastructure"
  tags: ["Linux", "Cloud", "Oracle Cloud", "Tailscale", "Caddy", "Nginx", "Reverse Proxy"]
  url: "/post/oracle-vps"
