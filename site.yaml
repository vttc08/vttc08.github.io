- slug: "find-my-force"
  title: "Find My Force - Red Team Hackathon 2026"
  description: >-
    Our team built **Find My Force**, a real-time RF detection, classification, and geolocation system powered by semi-supervised machine learning, RSSI, IQ data and TDoA. The results were processed by a Flask and Socket.IO backend and streamed to a web dashboard using React and a Leaflet map. I was responsible for bringing together the ML model, geolocation algorithm, data parsing and the frontend. Despite working with unfamiliar technologies, our team adapted quickly and worked closely to deliver a cohesive solution.
