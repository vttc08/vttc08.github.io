- slug: "insta-v2ray"
  title: "Insta-V2Ray"
  description: >-
    I've built [Insta-V2Ray](https://github.com/vttc08/insta-v2ray), a Python full-stack application that enables remote access behind CG-NAT, using tunnel providers like Cloudflare, Pinggy and zrok to provide WebSocket tunnels. The application manages tunnel subprocesses concurrently, parses URLs and generates customized V2Ray subscriptions. I used inheritance, polymorphism and encapsulation to create a modular and maintainable codebase. Although I no longer rely on it personally, the project significantly strengthened my understanding of networking and Python OOP, which was helpful in my education.
