- slug: "clarity-index"
  title: "Clarity Index 360"
  description: >-
    I worked with a team of BCIT students on a [BCIT ISSP (Industry Sponsored Student Project)](https://www.bcit.ca/computing-academic-studies/industry-sponsored-student-projects/), focusing on 360 leadership assessment, built with React and Firebase. This application replaced manual Excel macro based workflow. I focused on Chart.js vsualization, data processing and client-side PDF report generation. I participated in weekly sponsor meetings to translate business requirements into technical solution and helped present the final product at the expo, where our team won first place.
