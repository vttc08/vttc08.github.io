- slug: "sci-201"
  title: "Effect of CPU C-State on Idle Power"
  description: >-
    CPUs enter C-states when idle to operate in low-power modes. I was interested in this topic and saving power for my home server, so I took the opportunity in [SCI 201](https://apps.ualberta.ca/catalogue/course/sci/201) at my university to perform an experiment to measure how C-states affect idle power consumption. I used a smart power meter, Home Assistant and InfluxDB for data collection and used pandas, R and matplotlib to summarize and present the data in a formal report.
  category: "Development"
  url: "https://github.com/vttc08/sci-201-cpu-c-states/releases/tag/report"
  read_more: "Download the research paper and data."
  type: "Statistics Research Project"
  tags: ["Python", "R", "Statistics", "Data Analysis", "Home Assistant", "InfluxDB"]
