- slug: "insta-v2ray"
  title: "Insta-V2Ray"
  description: >-
    I've built [Insta-V2Ray](https://github.com/vttc08/insta-v2ray), a Python full-stack application that enables remote access behind CG-NAT, using tunnel providers like Cloudalre, Pinggy and Zrok to provide a DPI resistant websocket tunnel. The application manages tunnel subprocesses concurrently, parses URLs and generate customized V2Ray subscriptions. I used inheritance, polymorphism and encapsulation to create a modular and maintainable codebase. Although I no longer rely on it personally, the project significantly strenghened my understanding of networking and Python OOP, which was helpful in my education. 
  category: "Development"
  url: "/post/insta-v2ray"
