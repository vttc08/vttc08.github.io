- slug: "find-my-force"
  title: "Find My Force - Red Team Hackathon 2026"
  description: >-
    Our team built **Find My Force**, a real-time RF detection, classification, and geolocation system powered by semi-supervised machine learning, RSSI, IQ data and TDoA. The results were processed by Flask and SocketIO backend and streamed to a web dashboard using React and Leaflet map. I was responsible for brining together the ML model, geolocation algorithm, data parsing and the frontend. Despite working with unfamiliar technologies, our team adapter quickly and worked closely to deliver a cohesive solution.
  category: "Development"
  type: "🏆 1st Place Hackathon Winner"
  tags: ["Python", "Flask", "React", "Leaflet", "Machine Learning", "Hackathon"]
  url: "https://www.bcit.ca/news/stories/computing-takes-first-place/"
  images:
    - url: "https://www.bcit.ca/wp-content/uploads/2026/03/RedTeam1-1024x512.png"
      alt: "Marco Yu, Bruce Weng, Jackson Fleming, Kevin Hu, Gaston Roxas (not shown)"
    - url: "/static/images/redteamhack.webp"
      alt: "Marco Yu, Bruce Weng, Jackson Fleming, Kevin Hu, Gaston Roxas (not shown)"
  start_date: 2026-03-07
  featured: true
  read_more: "Computing takes first place and more at defence tech hack"

- slug: "clarity-index"
  title: "Clarity Index 360"
  description: >-
    I worked with a team of BCIT students on a [BCIT ISSP (Industry Sponsored Student Project)](https://www.bcit.ca/computing-academic-studies/industry-sponsored-student-projects/), focusing on 360 leadership assessment, built with React and Firebase. This application replaced manual Excel macro based workflow. I focused on Chart.js vsualization, data processing and client-side PDF report generation. I participated in weekly sponsor meetings to translate business requirements into technical solution and helped present the final product at the expo, where our team won first place.
  category: "Development"
  type: "🏆 1st Place BCIT ISSP Winner"
  tags: ["React", "Firebase", "Chart.js", "Project Management"]
